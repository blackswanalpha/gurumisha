<!-- Modern Compare Button Component with Enhanced Design and Accessibility -->
<button
    id="compare-btn-{{ car.id }}"
    hx-post="{% if in_compare %}{% url 'core:remove_from_compare' car.id %}{% else %}{% url 'core:add_to_compare' car.id %}{% endif %}"
    hx-target="#compare-btn-{{ car.id }}"
    hx-swap="outerHTML"
    hx-trigger="click"
    hx-indicator="#compare-loading-{{ car.id }}"
    hx-on:htmx:before-request="this.setAttribute('aria-busy', 'true')"
    hx-on:htmx:after-request="this.setAttribute('aria-busy', 'false')"
    class="group relative flex items-center justify-center px-4 sm:px-6 py-3 bg-white/90 backdrop-blur-sm border-2 {% if in_compare %}border-blue-500 text-blue-600 shadow-lg shadow-blue-500/20{% else %}border-gray-300 text-gray-600{% endif %} rounded-xl font-semibold transition-all duration-500 hover:scale-105 hover:shadow-xl hover:shadow-blue-500/25 focus:outline-none focus:ring-4 focus:ring-blue-500/20 min-h-[48px] w-full sm:w-auto"
    type="button"
    aria-label="{% if in_compare %}Remove {{ car.title }} from comparison{% else %}Add {{ car.title }} to comparison{% endif %}"
    aria-describedby="compare-help-{{ car.id }}"
    aria-pressed="{% if in_compare %}true{% else %}false{% endif %}"
    role="button"
    tabindex="0">

    <!-- Animated Background Gradient -->
    <div class="absolute inset-0 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-600 opacity-0 {% if in_compare %}group-hover:opacity-20{% else %}group-hover:opacity-10{% endif %} transition-all duration-500 rounded-xl"></div>

    <!-- Active State Indicator -->
    {% if in_compare %}
    <div class="absolute inset-0 bg-blue-500/20 rounded-xl animate-pulse"></div>
    {% endif %}

    <!-- Loading Indicator -->
    <div id="compare-loading-{{ car.id }}" class="absolute inset-0 bg-white/80 backdrop-blur-sm rounded-xl flex items-center justify-center opacity-0 transition-opacity duration-200 htmx-indicator">
        <div class="w-5 h-5 border-2 border-blue-500 border-t-transparent rounded-full animate-spin" role="status" aria-label="Loading"></div>
    </div>

    <!-- Scale Icon with Enhanced Animation -->
    <div class="relative z-10 flex items-center space-x-3">
        <div class="relative">
            <i class="fas fa-balance-scale {% if in_compare %}text-blue-500{% else %}text-gray-500{% endif %} text-lg transition-all duration-300 group-hover:scale-125 group-hover:rotate-12 {% if in_compare %}animate-bounce{% endif %}" aria-hidden="true"></i>

            <!-- Count Badge for Active State -->
            {% if in_compare and compare_count > 0 %}
            <div class="absolute -top-2 -right-2 w-5 h-5 bg-blue-500 text-white text-xs rounded-full flex items-center justify-center font-bold animate-pulse" aria-label="{{ compare_count }} cars in comparison">
                {{ compare_count }}
            </div>
            {% endif %}
        </div>

        <!-- Text with Dynamic Content -->
        <span class="relative z-10 font-montserrat font-semibold tracking-wide transition-all duration-300 group-hover:text-blue-600">
            {% if in_compare %}
                <span class="flex items-center space-x-1">
                    <span>Comparing</span>
                    {% if compare_count > 1 %}
                        <span class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded-full" aria-label="{{ compare_count }} cars">{{ compare_count }}</span>
                    {% endif %}
                </span>
            {% else %}
                Compare Cars
            {% endif %}
        </span>
    </div>

    <!-- Ripple Effect on Click -->
    <div class="absolute inset-0 rounded-xl overflow-hidden" aria-hidden="true">
        <div class="absolute inset-0 bg-blue-500/30 scale-0 group-active:scale-100 transition-transform duration-300 rounded-xl"></div>
    </div>

    <!-- Floating Compare Link for Active State -->
    {% if in_compare and compare_count > 1 %}
    <div class="absolute -bottom-8 left-1/2 transform -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-all duration-300">
        <a href="{% url 'core:car_compare' %}"
           class="text-xs text-blue-600 hover:text-blue-800 font-medium underline whitespace-nowrap focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 rounded px-1"
           aria-label="View comparison of {{ compare_count }} cars">
            View Comparison
        </a>
    </div>
    {% endif %}
</button>

<!-- Screen Reader Help Text -->
<div id="compare-help-{{ car.id }}" class="sr-only">
    {% if in_compare %}
        This car is currently in your comparison list with {{ compare_count|default:0 }} car{{ compare_count|pluralize }}. Click to remove it.
    {% else %}
        Click to add this car to your comparison list. You can compare up to 4 cars side by side.
    {% endif %}
</div>

<!-- Success/Error Message Container -->
<div id="compare-message-{{ car.id }}" class="mt-2" role="status" aria-live="polite" aria-atomic="true"></div>
