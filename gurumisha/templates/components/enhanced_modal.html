{% load static %}

<!-- Enhanced Modal Component with Out-of-Band Swaps -->
<!-- Usage: {% include 'components/enhanced_modal.html' with modal_id='my-modal' modal_title='Modal Title' modal_size='lg' %} -->

<!-- Modal Trigger Button (Separate from Modal) -->
<button 
    class="modal-trigger-btn {{ trigger_class|default:'btn-primary' }}"
    hx-get="{{ modal_url }}"
    hx-target="this"
    hx-swap="none"
    hx-indicator="#modal-loading-{{ modal_id }}"
    onclick="showModalLoading('{{ modal_id }}')"
    data-modal-trigger="{{ modal_id }}"
    {{ trigger_attrs|safe }}>
    
    {% if trigger_icon %}
        <i class="{{ trigger_icon }} mr-2"></i>
    {% endif %}
    {{ trigger_text|default:'Open Modal' }}
</button>

<!-- Loading Indicator -->
<div id="modal-loading-{{ modal_id }}" class="htmx-indicator inline-block ml-2">
    <div class="w-4 h-4 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
</div>

<!-- Modal Container (Placed at bottom of page, separate from trigger) -->
<div id="{{ modal_id }}" 
     class="modal fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm"
     style="display: none;"
     data-backdrop-close="true"
     role="dialog"
     aria-labelledby="{{ modal_id }}-title"
     aria-hidden="true">
    
    <!-- Modal Content -->
    <div class="modal-content bg-white rounded-2xl shadow-2xl max-w-{{ modal_size|default:'md' }} w-full mx-4 max-h-[90vh] overflow-hidden transform transition-all duration-300 scale-95 opacity-0"
         x-data="{ show: false }"
         x-show="show"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95">
        
        <!-- Modal Header -->
        <div class="modal-header flex items-center justify-between p-6 border-b border-gray-200">
            <h2 id="{{ modal_id }}-title" class="text-xl font-bold text-gray-900">
                {% if modal_icon %}
                    <i class="{{ modal_icon }} mr-2 text-blue-600"></i>
                {% endif %}
                {{ modal_title|default:'Modal Title' }}
            </h2>
            
            <button type="button" 
                    class="modal-close-btn text-gray-400 hover:text-gray-600 transition-colors duration-200"
                    data-modal-close="{{ modal_id }}"
                    aria-label="Close modal">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        
        <!-- Modal Body (Content will be loaded here via OOB) -->
        <div id="{{ modal_id }}-body" class="modal-body p-6 overflow-y-auto max-h-[60vh]">
            <!-- Default content or loading state -->
            <div class="text-center py-8">
                <div class="animate-pulse">
                    <div class="h-4 bg-gray-200 rounded mb-3"></div>
                    <div class="h-4 bg-gray-200 rounded mb-3 w-3/4 mx-auto"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/2 mx-auto"></div>
                </div>
            </div>
        </div>
        
        <!-- Modal Footer (Optional) -->
        {% if modal_footer %}
        <div id="{{ modal_id }}-footer" class="modal-footer flex items-center justify-end space-x-3 p-6 border-t border-gray-200 bg-gray-50">
            {{ modal_footer|safe }}
        </div>
        {% endif %}
    </div>
</div>

<!-- Enhanced Modal Styles -->
<style>
    /* Modal animations */
    .modal {
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    
    .modal.modal-show {
        opacity: 1;
        visibility: visible;
    }
    
    .modal.modal-hide {
        opacity: 0;
        visibility: hidden;
    }
    
    .modal-content {
        transition: transform 0.3s ease, opacity 0.3s ease;
    }
    
    .modal.modal-show .modal-content {
        transform: scale(1);
        opacity: 1;
    }
    
    .modal.modal-hide .modal-content {
        transform: scale(0.95);
        opacity: 0;
    }
    
    /* Modal sizes */
    .max-w-sm { max-width: 24rem; }
    .max-w-md { max-width: 28rem; }
    .max-w-lg { max-width: 32rem; }
    .max-w-xl { max-width: 36rem; }
    .max-w-2xl { max-width: 42rem; }
    .max-w-3xl { max-width: 48rem; }
    .max-w-4xl { max-width: 56rem; }
    .max-w-5xl { max-width: 64rem; }
    .max-w-6xl { max-width: 72rem; }
    .max-w-full { max-width: 100%; }
    
    /* Responsive modal */
    @media (max-width: 640px) {
        .modal-content {
            margin: 1rem;
            max-height: 95vh;
        }
        
        .modal-header {
            padding: 1rem;
        }
        
        .modal-body {
            padding: 1rem;
            max-height: 70vh;
        }
        
        .modal-footer {
            padding: 1rem;
        }
    }
    
    /* Loading state */
    .modal-loading .modal-body {
        opacity: 0.7;
        pointer-events: none;
    }
    
    /* Focus management */
    .modal:focus {
        outline: none;
    }
    
    /* Backdrop blur effect */
    .modal {
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }
</style>

<!-- Enhanced Modal JavaScript -->
<script>
// Modal loading state management
function showModalLoading(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) {
        modal.classList.add('modal-loading');
        showModal(modalId);
    }
}

function hideModalLoading(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) {
        modal.classList.remove('modal-loading');
    }
}

// Enhanced modal event handling
document.addEventListener('DOMContentLoaded', function() {
    // Handle HTMX events for modals
    document.addEventListener('htmx:afterRequest', function(event) {
        const trigger = event.detail.elt;
        const modalId = trigger.getAttribute('data-modal-trigger');
        
        if (modalId && event.detail.successful) {
            hideModalLoading(modalId);
        }
    });
    
    // Handle HTMX errors for modals
    document.addEventListener('htmx:responseError', function(event) {
        const trigger = event.detail.elt;
        const modalId = trigger.getAttribute('data-modal-trigger');
        
        if (modalId) {
            hideModalLoading(modalId);
            
            // Show error in modal
            const modalBody = document.getElementById(modalId + '-body');
            if (modalBody) {
                modalBody.innerHTML = `
                    <div class="text-center py-8">
                        <div class="text-red-500 mb-4">
                            <i class="fas fa-exclamation-triangle text-4xl"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-900 mb-2">Error Loading Content</h3>
                        <p class="text-gray-600 mb-4">Failed to load modal content. Please try again.</p>
                        <button onclick="location.reload()" 
                                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition-colors">
                            Retry
                        </button>
                    </div>
                `;
            }
        }
    });
    
    // Setup modal close handlers
    document.addEventListener('click', function(event) {
        if (event.target.hasAttribute('data-modal-close')) {
            const modalId = event.target.getAttribute('data-modal-close');
            hideModal(modalId);
        }
    });
});

// Utility function for programmatic modal opening
window.openModal = function(modalId, contentUrl) {
    if (contentUrl) {
        htmxModalRequest(contentUrl, {
            target: 'this',
            swap: 'none'
        });
    }
    showModal(modalId);
};

// Utility function for updating modal content via OOB
window.updateModalContent = function(modalId, content) {
    const modalBody = document.getElementById(modalId + '-body');
    if (modalBody) {
        modalBody.innerHTML = content;
        
        // Re-hydrate Alpine.js components
        if (typeof Alpine !== 'undefined') {
            Alpine.initTree(modalBody);
        }
    }
};
</script>
