<!-- Modal Container with Alpine.js Scope -->
<div x-data="{ saving: false }">

<!-- Modern Status Update Modal -->
<div class="bg-gradient-to-br from-blue-600 via-blue-500 to-indigo-600 px-8 py-6 relative overflow-hidden">
    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-10">
        <div class="absolute inset-0 bg-gradient-to-r from-white/20 to-transparent"></div>
    </div>
    
    <div class="relative flex items-center justify-between">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center">
                <i class="fas fa-edit text-white text-lg"></i>
            </div>
            <div>
                <h3 class="text-2xl font-bold text-white font-montserrat">Update Status</h3>
                <p class="text-blue-100 mt-1 font-raleway">{{ inquiry.subject }}</p>
            </div>
        </div>
        <button onclick="closeModal()" class="w-10 h-10 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center text-white hover:bg-white/30 transition-all duration-200 transform hover:scale-110">
            <i class="fas fa-times"></i>
        </button>
    </div>
</div>

<!-- Modern Modal Body -->
<div class="p-8 bg-gradient-to-br from-gray-50 to-white">
    <form id="status-form"
          hx-post="{% url 'core:admin_query_status_update' inquiry.id %}" 
          hx-target="#modal-content-area" 
          hx-swap="innerHTML"
          @submit="saving = true"
          class="space-y-6">
        {% csrf_token %}
        
        <!-- Current Status Display -->
        <div class="glass-card p-6">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-gradient-to-br from-gray-500 to-gray-600 rounded-xl flex items-center justify-center">
                    <i class="fas fa-info-circle text-white"></i>
                </div>
                <h4 class="text-lg font-bold text-gray-900 font-montserrat">Current Status</h4>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-sm font-medium text-gray-600 font-raleway">Status</label>
                    <div class="mt-1 px-3 py-2 bg-gray-100 rounded-lg">
                        <span class="text-sm font-semibold text-gray-900">{{ inquiry.get_status_display }}</span>
                    </div>
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-600 font-raleway">Priority</label>
                    <div class="mt-1 px-3 py-2 bg-gray-100 rounded-lg">
                        <span class="text-sm font-semibold text-gray-900">{{ inquiry.get_priority_display }}</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Update Form -->
        <div class="glass-card p-6">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl flex items-center justify-center">
                    <i class="fas fa-arrow-right text-white"></i>
                </div>
                <h4 class="text-lg font-bold text-gray-900 font-montserrat">Update To</h4>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="status" class="block text-sm font-medium text-gray-700 mb-2 font-montserrat">New Status</label>
                    <select name="status" id="status" class="w-full px-4 py-3 bg-white/50 backdrop-blur-sm border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200">
                        {% for value, label in status_choices %}
                        <option value="{{ value }}" {% if value == inquiry.status %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label for="priority" class="block text-sm font-medium text-gray-700 mb-2 font-montserrat">Priority</label>
                    <select name="priority" id="priority" class="w-full px-4 py-3 bg-white/50 backdrop-blur-sm border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200">
                        {% for value, label in priority_choices %}
                        <option value="{{ value }}" {% if value == inquiry.priority %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <!-- Internal Notes -->
        <div class="glass-card p-6">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-gradient-to-br from-yellow-500 to-yellow-600 rounded-xl flex items-center justify-center">
                    <i class="fas fa-sticky-note text-white"></i>
                </div>
                <label for="internal_notes" class="text-lg font-bold text-gray-900 font-montserrat">Internal Notes (Optional)</label>
            </div>
            
            <textarea name="internal_notes" id="internal_notes" rows="3" 
                      placeholder="Add any internal notes about this status change..."
                      class="w-full px-4 py-3 bg-white/50 backdrop-blur-sm border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 resize-none"></textarea>
        </div>
    </form>
</div>

<!-- Modern Modal Footer -->
<div class="bg-gradient-to-r from-gray-50 to-white px-8 py-6 border-t border-gray-200">
    <div class="flex justify-between items-center">
        <button type="button" onclick="closeModal()" class="btn-modern btn-secondary" :disabled="saving">
            <i class="fas fa-times mr-2"></i>Cancel
        </button>
        <button type="submit" form="status-form" class="btn-modern btn-primary" :disabled="saving">
            <div x-show="saving" class="modern-spinner inline-block mr-2 w-4 h-4"></div>
            <i x-show="!saving" class="fas fa-save mr-2"></i>
            <span x-text="saving ? 'Updating Status...' : 'Update Status'"></span>
        </button>
    </div>
</div>

</div> <!-- End Alpine.js Container -->

<script>
// Handle form submission
document.addEventListener('htmx:afterRequest', function(event) {
    if (event.detail.successful && event.detail.xhr.responseURL.includes('status')) {
        if (window.toastManager) {
            window.toastManager.show('Status updated successfully!', 'success');
        }
        
        if (window.adminQueriesComponent) {
            window.adminQueriesComponent.closeModal();
            window.adminQueriesComponent.loadQueries();
        } else {
            closeModal();
        }
    }
});

function closeModal() {
    if (window.adminQueriesComponent) {
        window.adminQueriesComponent.closeModal();
    }
}
</script>
