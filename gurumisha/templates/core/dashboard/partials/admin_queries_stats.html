<!-- Modern Stats Dashboard -->
<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-6 mb-8 animate-fade-in-up" 
     style="animation-delay: 0.2s;" 
     id="query-stats"
     hx-get="{% url 'core:admin_queries_stats_htmx' %}"
     hx-trigger="every 30s"
     hx-swap="outerHTML">
    
    <div class="glass-card p-6 text-center group cursor-pointer">
        <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform duration-300">
            <i class="fas fa-inbox text-white text-lg"></i>
        </div>
        <div class="text-3xl font-bold text-blue-600 font-montserrat mb-1">{{ total_inquiries|default:0 }}</div>
        <div class="text-sm text-gray-600 font-raleway">Total Queries</div>
    </div>
    
    <div class="glass-card p-6 text-center group cursor-pointer">
        <div class="w-12 h-12 bg-gradient-to-br from-green-500 to-green-600 rounded-xl flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform duration-300">
            <i class="fas fa-plus-circle text-white text-lg"></i>
        </div>
        <div class="text-3xl font-bold text-green-600 font-montserrat mb-1">{{ new_inquiries|default:0 }}</div>
        <div class="text-sm text-gray-600 font-raleway">New</div>
    </div>
    
    <div class="glass-card p-6 text-center group cursor-pointer">
        <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform duration-300">
            <i class="fas fa-folder-open text-white text-lg"></i>
        </div>
        <div class="text-3xl font-bold text-indigo-600 font-montserrat mb-1">{{ open_inquiries|default:0 }}</div>
        <div class="text-sm text-gray-600 font-raleway">Open</div>
    </div>
    
    <div class="glass-card p-6 text-center group cursor-pointer">
        <div class="w-12 h-12 bg-gradient-to-br from-orange-500 to-orange-600 rounded-xl flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform duration-300">
            <i class="fas fa-clock text-white text-lg"></i>
        </div>
        <div class="text-3xl font-bold text-orange-600 font-montserrat mb-1">{{ in_progress_inquiries|default:0 }}</div>
        <div class="text-sm text-gray-600 font-raleway">In Progress</div>
    </div>
    
    <div class="glass-card p-6 text-center group cursor-pointer pulse-loading">
        <div class="w-12 h-12 bg-gradient-to-br from-red-500 to-red-600 rounded-xl flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform duration-300">
            <i class="fas fa-exclamation-triangle text-white text-lg"></i>
        </div>
        <div class="text-3xl font-bold text-red-600 font-montserrat mb-1">{{ urgent_inquiries|default:0 }}</div>
        <div class="text-sm text-gray-600 font-raleway">Urgent</div>
    </div>
    
    <div class="glass-card p-6 text-center group cursor-pointer pulse-loading">
        <div class="w-12 h-12 bg-gradient-to-br from-red-700 to-red-800 rounded-xl flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform duration-300">
            <i class="fas fa-fire text-white text-lg"></i>
        </div>
        <div class="text-3xl font-bold text-red-700 font-montserrat mb-1">{{ overdue_inquiries|default:0 }}</div>
        <div class="text-sm text-gray-600 font-raleway">Overdue</div>
    </div>
</div>
