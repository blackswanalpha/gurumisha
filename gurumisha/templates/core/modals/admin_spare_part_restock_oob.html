<!-- Enhanced Restock Spare Part Modal with OOB Swaps -->

<!-- Modal Trigger Button (Separate from Modal) -->
<button class="btn-harrier-primary px-4 py-2 rounded-lg text-sm font-semibold"
        hx-get="{% url 'core:admin_spare_part_restock_modal' spare_part.id %}"
        hx-target="this"
        hx-swap="none"
        hx-indicator="#restock-loading-{{ spare_part.id }}"
        data-modal-trigger="restock-modal-{{ spare_part.id }}">
    <i class="fas fa-plus-circle mr-2"></i>
    Restock
</button>

<!-- Loading Indicator -->
<div id="restock-loading-{{ spare_part.id }}" class="htmx-indicator inline-block ml-2">
    <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
</div>

<!-- Modal Container (Will be injected via OOB) -->
<div id="restock-modal-{{ spare_part.id }}" 
     class="modal fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm"
     style="display: none;"
     data-backdrop-close="true"
     role="dialog"
     aria-labelledby="restock-modal-{{ spare_part.id }}-title"
     aria-hidden="true">
    
    <!-- Modal Content -->
    <div class="modal-content bg-white rounded-2xl shadow-2xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-hidden">
        
        <!-- Modal Header -->
        <div class="modal-header bg-gradient-to-r from-harrier-red to-harrier-dark px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <div class="w-10 h-10 bg-white bg-opacity-20 rounded-lg flex items-center justify-center mr-3">
                        <i class="fas fa-plus-circle text-white"></i>
                    </div>
                    <div>
                        <h3 id="restock-modal-{{ spare_part.id }}-title" class="text-xl font-bold text-white font-montserrat">
                            Restock Spare Part
                        </h3>
                        <p class="text-white text-opacity-80 text-sm font-raleway">
                            Add stock to {{ spare_part.name }}
                        </p>
                    </div>
                </div>

                <!-- Close Button -->
                <button type="button"
                        class="text-white text-opacity-70 hover:text-white hover:bg-white hover:bg-opacity-20 rounded-lg p-2 transition-all duration-200"
                        data-modal-close="restock-modal-{{ spare_part.id }}"
                        aria-label="Close modal">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>
        </div>
        
        <!-- Modal Body (Content will be loaded here via OOB) -->
        <div id="restock-modal-{{ spare_part.id }}-body" class="modal-body">
            <!-- Loading state -->
            <div class="p-6 text-center">
                <div class="animate-pulse">
                    <div class="h-4 bg-gray-200 rounded mb-3"></div>
                    <div class="h-4 bg-gray-200 rounded mb-3 w-3/4 mx-auto"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/2 mx-auto"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Content Template (Loaded via OOB) -->
<!-- This would be returned by the server as an OOB swap -->
{% comment %}
Server Response Example:

<div id="restock-modal-{{ spare_part.id }}-body" hx-swap-oob="innerHTML" data-auto-show="true">
    <div class="p-6">
        <!-- Current Stock Info -->
        <div class="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-xl p-4 mb-6">
            <div class="flex items-center justify-between">
                <div>
                    <h4 class="font-semibold text-gray-900 mb-1">{{ spare_part.name }}</h4>
                    <p class="text-sm text-gray-600">SKU: {{ spare_part.sku }}</p>
                </div>
                <div class="text-right">
                    <div class="text-2xl font-bold text-blue-600">{{ spare_part.stock_quantity }}</div>
                    <div class="text-sm text-gray-500">Current Stock</div>
                </div>
            </div>
        </div>

        <!-- Restock Form -->
        <form hx-post="{% url 'core:admin_spare_part_restock' spare_part.id %}"
              hx-target="this"
              hx-swap="none"
              class="space-y-6">
            {% csrf_token %}
            
            <!-- Quantity Input -->
            <div class="form-group">
                <label class="form-label">Quantity to Add</label>
                <input type="number" 
                       name="quantity" 
                       min="1" 
                       required
                       class="form-input"
                       placeholder="Enter quantity">
            </div>

            <!-- Supplier Info -->
            <div class="form-group">
                <label class="form-label">Supplier (Optional)</label>
                <input type="text" 
                       name="supplier" 
                       class="form-input"
                       placeholder="Supplier name">
            </div>

            <!-- Cost per Unit -->
            <div class="form-group">
                <label class="form-label">Cost per Unit (Optional)</label>
                <input type="number" 
                       name="cost_per_unit" 
                       step="0.01"
                       class="form-input"
                       placeholder="0.00">
            </div>

            <!-- Notes -->
            <div class="form-group">
                <label class="form-label">Notes (Optional)</label>
                <textarea name="notes" 
                          rows="3" 
                          class="form-input"
                          placeholder="Additional notes about this restock..."></textarea>
            </div>

            <!-- Form Actions -->
            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-gray-200">
                <button type="button" 
                        class="btn-secondary"
                        data-modal-close="restock-modal-{{ spare_part.id }}">
                    Cancel
                </button>
                <button type="submit" 
                        class="btn-harrier-primary"
                        hx-indicator="#restock-submit-loading">
                    <span id="restock-submit-loading" class="htmx-indicator">
                        <i class="fas fa-spinner fa-spin mr-2"></i>
                    </span>
                    <i class="fas fa-plus-circle mr-2"></i>
                    Add Stock
                </button>
            </div>
        </form>
    </div>
</div>
{% endcomment %}

<!-- Enhanced Modal Styles -->
<style>
    /* Restock Modal Specific Styles */
    .restock-modal .form-group {
        margin-bottom: 1.5rem;
    }
    
    .restock-modal .form-label {
        display: block;
        font-weight: 600;
        color: #374151;
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
    }
    
    .restock-modal .form-input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .restock-modal .form-input:focus {
        outline: none;
        border-color: #dc2626;
        box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
    }
    
    .restock-modal .btn-secondary {
        padding: 0.75rem 1.5rem;
        background-color: #f3f4f6;
        color: #374151;
        border-radius: 0.5rem;
        font-weight: 600;
        transition: background-color 0.2s;
    }
    
    .restock-modal .btn-secondary:hover {
        background-color: #e5e7eb;
    }
    
    /* Success state animations */
    .restock-success {
        animation: successPulse 0.6s ease-out;
    }
    
    @keyframes successPulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }
    
    /* Error state styling */
    .restock-error .form-input {
        border-color: #ef4444;
        background-color: #fef2f2;
    }
    
    .restock-error-message {
        color: #ef4444;
        font-size: 0.875rem;
        margin-top: 0.25rem;
    }
</style>

<!-- Enhanced Modal JavaScript -->
<script>
// Restock modal specific functionality
document.addEventListener('DOMContentLoaded', function() {
    // Handle successful restock
    document.addEventListener('htmx:afterRequest', function(event) {
        if (event.detail.successful && event.target.closest('form[hx-post*="restock"]')) {
            const modalId = event.target.closest('.modal').id;
            
            // Show success message via OOB
            // Server should return success OOB update
            
            // Auto-close modal after 2 seconds
            setTimeout(() => {
                hideModal(modalId);
            }, 2000);
        }
    });
    
    // Handle restock form validation
    document.addEventListener('submit', function(event) {
        if (event.target.matches('form[hx-post*="restock"]')) {
            const quantityInput = event.target.querySelector('input[name="quantity"]');
            const quantity = parseInt(quantityInput.value);
            
            if (!quantity || quantity <= 0) {
                event.preventDefault();
                quantityInput.classList.add('border-red-500');
                
                // Show error message
                let errorMsg = quantityInput.parentNode.querySelector('.restock-error-message');
                if (!errorMsg) {
                    errorMsg = document.createElement('div');
                    errorMsg.className = 'restock-error-message';
                    quantityInput.parentNode.appendChild(errorMsg);
                }
                errorMsg.textContent = 'Please enter a valid quantity greater than 0';
                
                return false;
            }
        }
    });
});
</script>
