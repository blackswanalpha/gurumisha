{% load static %}

<!-- WhatsApp Floating Button Component -->
<div id="whatsapp-floating-widget" class="whatsapp-widget">
    <a href="https://wa.me/254720557457?text=Hello%20Gurumisha!%20I%27m%20interested%20in%20your%20automotive%20services.%20Could%20you%20please%20help%20me%3F"
       class="whatsapp-float"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Chat with us on WhatsApp"
       title="Chat with us on WhatsApp">
        <i class="fab fa-whatsapp" aria-hidden="true"></i>
        <span class="whatsapp-tooltip">Chat with us on WhatsApp</span>
        <div class="whatsapp-pulse"></div>
    </a>
</div>

<style>
/* WhatsApp Floating Button Styles */
.whatsapp-widget {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 9999;
}

.whatsapp-float {
    position: relative;
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #DC2626 0%, #B91C1C 25%, #991B1B 50%, #7F1D1D 75%, #1F2937 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(220, 38, 38, 0.4), 0 4px 12px rgba(31, 41, 55, 0.3);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    text-decoration: none;
    backdrop-filter: blur(20px);
    border: 2px solid rgba(255, 255, 255, 0.1);
    overflow: hidden;
    opacity: 0;
    transform: scale(0.8);
    animation: fadeInScale 0.6s ease-out 1s forwards;
}

.whatsapp-float::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, transparent 50%, rgba(0, 0, 0, 0.1) 100%);
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.whatsapp-float:hover::before {
    opacity: 1;
}

.whatsapp-float:hover {
    transform: scale(1.1);
    box-shadow: 0 12px 32px rgba(220, 38, 38, 0.5), 0 6px 16px rgba(31, 41, 55, 0.4);
}

.whatsapp-float i {
    font-size: 28px;
    color: white;
    z-index: 2;
    position: relative;
    transition: transform 0.3s ease;
}

.whatsapp-float:hover i {
    transform: scale(1.1);
}

.whatsapp-tooltip {
    position: absolute;
    right: 100%;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(31, 41, 55, 0.95);
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    margin-right: 12px;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-family: 'Inter', sans-serif;
}

.whatsapp-tooltip::after {
    content: '';
    position: absolute;
    left: 100%;
    top: 50%;
    transform: translateY(-50%);
    border: 6px solid transparent;
    border-left-color: rgba(31, 41, 55, 0.95);
}

.whatsapp-float:hover .whatsapp-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateY(-50%) translateX(-8px);
}

.whatsapp-pulse {
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    border-radius: 50%;
    background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
    opacity: 0.6;
    animation: pulse 2s infinite;
}

/* Animations */
@keyframes fadeInScale {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes pulse {
    0% {
        transform: scale(1);
        opacity: 0.6;
    }
    50% {
        transform: scale(1.2);
        opacity: 0.3;
    }
    100% {
        transform: scale(1);
        opacity: 0.6;
    }
}

/* Mobile Optimizations */
@media (max-width: 768px) {
    .whatsapp-widget {
        bottom: 20px;
        right: 20px;
    }
    
    .whatsapp-float {
        width: 56px;
        height: 56px;
    }
    
    .whatsapp-float i {
        font-size: 24px;
    }
    
    .whatsapp-tooltip {
        display: none; /* Hide tooltip on mobile to save space */
    }
}

@media (max-width: 480px) {
    .whatsapp-widget {
        bottom: 16px;
        right: 16px;
    }
    
    .whatsapp-float {
        width: 52px;
        height: 52px;
    }
    
    .whatsapp-float i {
        font-size: 22px;
    }
}

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
    .whatsapp-float {
        animation: none;
        opacity: 1;
        transform: scale(1);
    }
    
    .whatsapp-pulse {
        animation: none;
    }
    
    .whatsapp-float:hover {
        transform: none;
    }
}

/* High contrast mode */
@media (prefers-contrast: high) {
    .whatsapp-float {
        border: 3px solid white;
        background: #DC2626;
    }
}
</style>

<script>
// WhatsApp Floating Button JavaScript
document.addEventListener('DOMContentLoaded', function() {
    initializeWhatsAppButton();
});

function initializeWhatsAppButton() {
    const whatsappButton = document.querySelector('.whatsapp-float');
    
    if (!whatsappButton) return;
    
    // Add click tracking
    whatsappButton.addEventListener('click', function() {
        // Track WhatsApp button click
        if (typeof gtag !== 'undefined') {
            gtag('event', 'whatsapp_click', {
                'event_category': 'engagement',
                'event_label': 'floating_button'
            });
        }
        
        console.log('WhatsApp button clicked');
    });
    
    // Show/hide based on scroll position
    let lastScrollTop = 0;
    window.addEventListener('scroll', function() {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        
        if (scrollTop > 300) {
            whatsappButton.style.opacity = '1';
            whatsappButton.style.visibility = 'visible';
        } else {
            whatsappButton.style.opacity = '0';
            whatsappButton.style.visibility = 'hidden';
        }
        
        lastScrollTop = scrollTop;
    }, { passive: true });
}
</script>
